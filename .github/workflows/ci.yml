name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The deploy workflow runs these exact checks first; nothing deploys on red.
  workflow_call:

concurrency:
  # When called from deploy.yml this must not share (and cancel) the push run's group.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install (lockfile must match)
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm format:check
      - name: Build
        run: pnpm build && pnpm host:build
      - name: Tests (real Postgres via testcontainers on the runner's Docker)
        run: pnpm test
