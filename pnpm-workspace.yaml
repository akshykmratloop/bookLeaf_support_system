packages:
  - apps/*
  - packages/*
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  esbuild: true
  '@tailwindcss/oxide': true
  cpu-features: false
  ssh2: false
  protobufjs: false
overrides:
  # Prisma 6 pulls deepmerge-ts 7.x transitively (via @prisma/config); 7.x has a published advisory.
  deepmerge-ts: '>=8.0.0'
