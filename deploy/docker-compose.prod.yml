# The demo box: two backends, Postgres, Redis and Caddy (HTTPS) on one small server.
# Started by deploy/up.sh with:  docker compose -f deploy/docker-compose.prod.yml --env-file <env> up -d
# Every value comes from the env file rendered from AWS Secrets Manager (never committed).
# That includes PLATFORM_ADMIN_EMAIL / PLATFORM_ADMIN_PASSWORD (U-7): the super admin account the
# seed in up.sh creates or updates. Add both keys to the secret; leave both out for no console login.
# Images are pinned to exact versions (checked on Docker Hub 2026-11-01) so a redeploy never pulls
# a different Postgres, Redis or Caddy. CPU caps follow each service's memory share of the
# t4g.small (2 vCPU, 2 GB): about 0.75 CPU per 512 MB.
name: bookleaf

x-app: &app
  restart: unless-stopped
  # The rendered secret env first, then the published demo logins (they win).
  env_file:
    - ${BOOKLEAF_ENV_FILE:?set BOOKLEAF_ENV_FILE to the rendered env file}
    - ./demo-logins.env
  logging:
    driver: json-file
    options: { max-size: '10m', max-file: '3' }

services:
  postgres:
    image: postgres:16.15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bookleaf
      POSTGRES_DB: bookleaf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U bookleaf']
      interval: 5s
      retries: 20
    mem_limit: 384m
    cpus: 0.6

  redis:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    # Shared state only (rate counters, one-use claims, chat lines), all with a TTL: when full,
    # evict the keys closest to expiry rather than refuse writes.
    command:
      [
        'redis-server',
        '--save',
        '',
        '--appendonly',
        'no',
        '--maxmemory',
        '64mb',
        '--maxmemory-policy',
        'volatile-ttl',
      ]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 20
    mem_limit: 96m
    cpus: 0.15

  api:
    <<: *app
    build: { context: .., dockerfile: deploy/Dockerfile.api }
    image: bookleaf-api:latest
    environment:
      # Two roles on one database (S.8): requests run as the restricted app role under row-level
      # security; migrations, seed, signup, sign-in lookups and the worker run as the owner.
      # up.sh creates/updates bookleaf_app (node dist/db-roles.js) before the API starts, and
      # sets POSTGRES_APP_PASSWORD from POSTGRES_PASSWORD when the secret does not carry one.
      DATABASE_URL: postgresql://bookleaf_app:${POSTGRES_APP_PASSWORD:?run through deploy/up.sh}@postgres:5432/bookleaf
      DATABASE_ADMIN_URL: postgresql://bookleaf:${POSTGRES_PASSWORD}@postgres:5432/bookleaf
      REDIS_URL: redis://redis:6379
      HOST_API_URL: http://host-demo:3200
      # The web build inside the image: the API serves the widget pages (/embed/<slug>, F-18).
      WEB_DIST_DIR: /app/web
      PORT: '3000'
      HOST: 0.0.0.0
    ports: ['127.0.0.1:3000:3000']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      host-demo: { condition: service_started }
    # Time to finish open requests and stop the worker before SIGKILL (the default is 10 s).
    stop_grace_period: 30s
    mem_limit: 512m
    cpus: 0.75

  host-demo:
    <<: *app
    build: { context: .., dockerfile: deploy/Dockerfile.host-demo }
    image: bookleaf-host-demo:latest
    environment:
      HOST_DEMO_PORT: '3200'
      # Reached only through Caddy: sign-in limits count the visitor from X-Forwarded-For.
      HOST_TRUST_PROXY: 'true'
    ports: ['127.0.0.1:3200:3200']
    stop_grace_period: 30s
    mem_limit: 256m
    cpus: 0.4

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    network_mode: host
    environment:
      API_HOST: ${API_HOST:?}
      HOST_API_HOST: ${HOST_API_HOST:?}
      ACME_EMAIL: ${ACME_EMAIL:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m
    cpus: 0.2

volumes:
  pgdata:
  caddy_data:
  caddy_config:
