# Local development database. Tests use their own throwaway container (testcontainers).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bookleaf
      POSTGRES_PASSWORD: bookleaf
      POSTGRES_DB: bookleaf
    ports:
      - "5433:5432"
    volumes:
      - bookleaf-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookleaf"]
      interval: 5s
      retries: 10
volumes:
  bookleaf-db:
