# Local development database and Redis. Tests use their own throwaway containers (testcontainers).
services:
  # POSTGRES_USER is the owner (DATABASE_ADMIN_URL). The API serves requests as a second,
  # restricted role under row-level security (DATABASE_URL, S.8); `npm run local` creates it with
  # `pnpm db:roles` after migrating, on a new volume and on an existing one.
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bookleaf
      POSTGRES_PASSWORD: bookleaf
      POSTGRES_DB: bookleaf
    ports:
      - '5433:5432'
    volumes:
      - bookleaf-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bookleaf']
      interval: 5s
      retries: 10
  # Shared state for every copy of the API (F-19): live updates, rate limits, one-use tokens.
  # Nothing in it needs to survive a restart, so it is not saved to disk.
  redis:
    image: redis:7-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10
volumes:
  bookleaf-db:
