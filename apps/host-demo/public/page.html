<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="support-url" content="__SUPPORT_URL__" />
    <title>BookLeaf (demo host)</title>
    <style>
      body {
        font:
          15px/1.5 system-ui,
          sans-serif;
        margin: 0;
        background: #f6f5f2;
        color: #1d1d1b;
      }
      main {
        max-width: 560px;
        margin: 48px auto;
        padding: 0 16px;
      }
      .card {
        background: #fff;
        border: 1px solid #e3e1db;
        border-radius: 12px;
        padding: 24px;
      }
      label {
        display: block;
        margin: 12px 0 4px;
        font-weight: 600;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 8px 10px;
        border: 1px solid #ccc;
        border-radius: 8px;
      }
      button {
        margin-top: 16px;
        padding: 9px 16px;
        border: 0;
        border-radius: 8px;
        background: #2f5d50;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }
      .muted {
        color: #6b6a65;
        font-size: 13px;
      }
      [hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>BookLeaf</h1>
      <p class="muted">
        A stand-in for BookLeaf's own product. It owns the authors and their books, and attaches the
        support module through the host contract in docs/integration.md.
      </p>
      <form id="login" class="card" hidden>
        <label for="email">Email</label>
        <input id="email" type="email" value="priya.sharma@email.com" required />
        <label for="password">Password</label>
        <input id="password" type="password" value="Author@BookLeaf1" required />
        <button type="submit">Sign in</button>
        <p id="error" class="muted" role="alert"></p>
      </form>
      <section id="home" class="card" hidden>
        <p>Signed in as <strong id="name"></strong>.</p>
        <button id="support" type="button">Open support in a new tab</button>
        <button id="logout" type="button">Sign out</button>
      </section>
    </main>
    <script src="/page.js" type="module"></script>
  </body>
</html>
